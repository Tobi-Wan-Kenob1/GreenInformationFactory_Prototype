name: Relevance check — record returned documents and draw the rater sample (once)

# PROTOCOL.md B.7. Re-records the broad seed set over the archived corpora with
# the app at the manifests' commit and only the recorder updated, requires every
# previously recorded field to come out identical, keeps the returned document
# ids, and draws the two-rater sample. One shot.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/validation-paper
    paths:
      - ".github/workflows/relevance-sample.yml"

permissions:
  contents: write

env:
  TOOL_COMMIT: "8ff0b3537e5b9e1d938b2e90abc392811ac2c35e"
  RECORDER_COMMIT: "f7e1d264d7b53d18af08871eb9230bf94ee118ef"

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/validation-paper
          path: study
      - name: Refuse a second draw
        run: |
          if [ -e study/paper/results/relevance/key.json ]; then
            echo "the relevance sample exists; a re-draw is a deviation, not a retry"; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: claude/policy-grant-finder-l84zm2
          fetch-depth: 0
          path: tool
      - name: App at the manifests' commit, recorder updated
        working-directory: tool
        run: |
          git checkout --quiet "$TOOL_COMMIT"
          git checkout --quiet "$RECORDER_COMMIT" -- tests/browser/record.js
          git status --short
          test -z "$(git status --short -- docs src)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tool/tests/browser/package-lock.json
      - run: python -m pip install --quiet -e tool numpy
      - working-directory: tool/tests/browser
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci
      - working-directory: tool/tests/browser
        run: npx playwright install --with-deps chromium
      - name: Record returned documents, both arms
        run: |
          for pair in A1:2009 A2:2013; do
            IFS=: read arm year <<< "$pair"
            CORPUS="study/paper/data/frozen-$arm"
            gif freeze --out "$CORPUS" --verify
            QUERIES=$(python -c "import json,sys; print(','.join(json.load(open(sys.argv[1]))['queries']))" "$CORPUS/queries.json")
            node tool/tests/browser/record.js --corpus "$CORPUS" --out "new-$arm.json" \
              --queries "$QUERIES" --from 1990 --to "$year" --label "$arm-returned"
            python - "$arm" <<'PY'
          import json, sys
          arm = sys.argv[1]
          d = f"study/paper/data/frozen-{arm}"
          old = json.load(open(f"{d}/recorded.json"))
          new = json.load(open(f"new-{arm}.json"))
          assert not new["pageErrors"], new["pageErrors"]
          out = []
          for o, n in zip(old["runs"], new["runs"]):
              returned = n.pop("returned")
              assert n == o, f"{arm}: run {o['query']} changed beyond the returned ids"
              assert returned is not None and len(returned) == o["counts"]["policies"] + o["counts"]["grants"], o["query"]
              out.append({"query": o["query"], "returned": returned})
          json.dump({"arm": arm, "protocol": "Appendix B.7", "recorded": new["recorded"],
                     "app_commit": "${{ env.TOOL_COMMIT }}", "recorder_commit": "${{ env.RECORDER_COMMIT }}",
                     "runs": out}, open(f"{d}/returned.json", "w"), indent=1)
          print(arm, {r["query"]: len(r["returned"]) for r in out})
          PY
          done
      - name: Draw the rater sample
        working-directory: study
        run: python paper/analysis/relevance_sample.py --data paper/data --out paper/results/relevance
      - name: Commit
        working-directory: study
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/data/frozen-A1/returned.json paper/data/frozen-A2/returned.json paper/results/relevance
          git commit -m "Relevance check: returned documents and the two-rater sample (protocol B.7)" \
                     -m "App at ${TOOL_COMMIT}, recorder from ${RECORDER_COMMIT}; every previously recorded field verified unchanged."
          for i in 1 2 3 4; do
            git pull --rebase origin claude/validation-paper && git push origin HEAD:claude/validation-paper && break
            sleep $((i * 5))
          done
