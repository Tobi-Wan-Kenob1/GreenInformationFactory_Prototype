name: Archive the candidate corpora for registration

# The corpora the registration will cite currently exist only as Actions
# artifacts, which expire. A registration pointing at an expired artifact
# points at nothing, so this moves them into the repository — public,
# timestamped by the commit, and permanent — and verifies each file against the
# manifest written when it was frozen, before anything is committed.
#
# It also extracts every value the registration has to quote (digests, query
# lists, per-side frequencies) into one file, so nothing is retyped by hand from
# a log. A hand-copied hash with one wrong character would make the corpus
# unverifiable, which is the one property the registration exists to give it.
#
# And it reads OSF's own help pages, because the session building this cannot
# reach them and the filing instructions should come from OSF, not memory.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/validation-paper
    paths:
      - ".github/workflows/archive-corpora.yml"

permissions:
  contents: write   # to commit the archived corpora
  actions: read     # to download another run's artifacts

env:
  # The run that froze, selected and recorded the candidate corpora.
  SOURCE_RUN: "44684136624"

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/validation-paper

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the frozen corpora from run ${{ env.SOURCE_RUN }}
        uses: actions/download-artifact@v4
        with:
          pattern: benchmark-*
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: incoming

      - name: Verify against the manifests, archive, and extract the values
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, shutil, sys

          SOURCE_RUN = "${{ env.SOURCE_RUN }}"
          REPO = "${{ github.repository }}"
          incoming = pathlib.Path("incoming")
          dest_root = pathlib.Path("paper/data")
          dest_root.mkdir(parents=True, exist_ok=True)

          def sha256(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      h.update(chunk)
              return h.hexdigest()

          def content_digest(items):
              # Must match gif.freeze.content_digest exactly, or a correct
              # corpus would fail its own check.
              canonical = json.dumps(sorted(items, key=lambda d: str(d.get("id") or "")),
                                     sort_keys=True, separators=(",", ":"),
                                     ensure_ascii=False)
              return hashlib.sha256(canonical.encode("utf-8")).hexdigest()

          out = []
          w = out.append
          w("# Registration values")
          w("")
          w("Generated by `.github/workflows/archive-corpora.yml` from Actions run")
          w(f"[`{SOURCE_RUN}`](https://github.com/{REPO}/actions/runs/{SOURCE_RUN}).")
          w("Every value below was computed from the archived files, not copied by hand.")
          w("Paste from here into the registration; do not retype.")
          w("")

          failed = False
          for arm in ("A1", "A2"):
              src = incoming / f"benchmark-{arm}"
              if not src.is_dir():
                  print(f"!! benchmark-{arm} missing from the run"); failed = True; continue
              manifest = json.loads((src / "manifest.json").read_text(encoding="utf-8"))

              # Verify every file before archiving it. A corpus that no longer
              # matches the manifest it was frozen with is not the corpus that
              # was frozen.
              problems = []
              for f in manifest["files"]:
                  path = src / f["name"]
                  if not path.exists():
                      problems.append(f"{f['name']} missing"); continue
                  if sha256(path) != f["sha256"]:
                      problems.append(f"{f['name']} file hash mismatch")
                  items = json.loads(path.read_text(encoding="utf-8")).get("items") or []
                  if content_digest(items) != f.get("content_sha256"):
                      problems.append(f"{f['name']} content digest mismatch")
              if problems:
                  print(f"!! {arm} FAILS verification: {problems}"); failed = True; continue
              print(f"{arm}: all {len(manifest['files'])} files match the manifest")

              dest = dest_root / f"frozen-{arm}"
              if dest.exists():
                  shutil.rmtree(dest)
              shutil.copytree(src, dest)
              manifest_sha = sha256(dest / "manifest.json")

              pf = manifest.get("policy_filter") or {}
              enr = pf.get("enriched_text") or {}
              tool = manifest.get("tool") or {}

              w(f"## Arm {arm} — frozen at {manifest['window']['until']}")
              w("")
              w(f"- **Archived at:** `paper/data/frozen-{arm}/`")
              w(f"- **manifest.json SHA-256:** `{manifest_sha}`")
              w(f"- **Frozen:** {manifest['created']}")
              w(f"- **Window:** {manifest['window']['since']} to {manifest['window']['until']}")
              w(f"- **Tool commit:** `{tool.get('commit')}` (dirty: {tool.get('dirty')})")
              w(f"- **Documents:** {manifest['documents']}, complete: {manifest.get('complete')}, "
                f"window violations: {len(manifest.get('window_violations') or [])}, "
                f"undated: {len(manifest.get('undated') or [])}")
              w(f"- **Policy filter:** routine acts excluded: {pf.get('excluded_routine')}; "
                f"minimum EuroVoc descriptors: {pf.get('min_subjects')}")
              if enr:
                  w(f"- **Act text:** {enr.get('enriched')} of {enr.get('documents')} acts "
                    f"enriched; outcomes {enr.get('statuses')}")
              w("")
              w("| File | Items | Earliest | Latest | File SHA-256 | Content SHA-256 |")
              w("|---|---|---|---|---|---|")
              for f in manifest["files"]:
                  w(f"| `{f['name']}` | {f['items']} | {f.get('earliest') or '—'} | "
                    f"{f.get('latest') or '—'} | `{f['sha256']}` | `{f.get('content_sha256')}` |")
              w("")

              for fname, title in (("queries.json", "Broad seed set (H1, H2)"),
                                   ("queries-both-sides.json", "Bridging seed set (H3, H4)")):
                  sel = json.loads((dest / fname).read_text(encoding="utf-8"))
                  w(f"### {title}")
                  w("")
                  w(f"Rule: max df {sel['rule']['max_df']} applied to "
                    f"{sel['rule'].get('max_df_applies_to', 'the corpus')}; "
                    f"require both sides: {sel['rule'].get('require_both_sides')}; "
                    f"top {sel['rule']['top']}; ties {sel['rule']['tie_break']}.")
                  w(f"Corpus sides: {sel['documents_by_side']['policy']} policy, "
                    f"{sel['documents_by_side']['grant']} funding.")
                  w("")
                  w("| Rank | Code | Codebook papers | Policy docs | Funding docs |")
                  w("|---|---|---|---|---|")
                  for c in sel["selected"]:
                      w(f"| {c['rank']} | `{c['code']}` | {c['papers']} | "
                        f"{c['policy_documents']} | {c['grant_documents']} |")
                  w("")
                  w(f"**Queries:** {', '.join(sel['queries'])}")
                  w("")

          (dest_root / "REGISTRATION_VALUES.md").write_text("\n".join(out) + "\n", encoding="utf-8")
          print("\n".join(out))
          sys.exit(1 if failed else 0)
          PY

      - name: Commit the archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/data
          if git diff --cached --quiet; then
            echo "nothing new to archive"
          else
            git commit -m "Archive candidate corpora A1 and A2 from run ${SOURCE_RUN}" \
                       -m "Each file verified against the manifest written when it was frozen."
            git push origin HEAD:claude/validation-paper
          fi

  osf-help:
    # Read OSF's own instructions, since the session that wrote this workflow
    # cannot reach osf.io and the filing steps should not come from memory.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet requests
      - name: Read OSF registration help
        run: |
          python - <<'PY'
          import html, re, requests
          pages = [
              "https://help.osf.io/article/158-create-a-preregistration",
              "https://help.osf.io/article/330-welcome-to-registrations",
              "https://help.osf.io/article/159-register-your-project",
              "https://help.osf.io/article/229-select-a-registration-template",
              "https://help.osf.io/article/150-withdraw-a-registration",
              "https://help.osf.io/article/146-registration-embargoes",
          ]
          for url in pages:
              print(f"\n{'=' * 78}\n{url}\n{'=' * 78}")
              try:
                  r = requests.get(url, timeout=60, headers={"User-Agent": "Mozilla/5.0"})
              except Exception as exc:
                  print(f"  failed: {type(exc).__name__}: {exc}"); continue
              print(f"  HTTP {r.status_code}")
              if r.status_code >= 400:
                  continue
              body = r.text
              m = re.search(r'<article[^>]*>(.*?)</article>', body, re.S) or \
                  re.search(r'<div[^>]+id="fullArticle"[^>]*>(.*?)</div>\s*</div>', body, re.S)
              text = m.group(1) if m else body
              text = re.sub(r'<(script|style)\b.*?</\1>', ' ', text, flags=re.S)
              text = re.sub(r'<li[^>]*>', '\n  - ', text)
              text = re.sub(r'<(br|p|h\d)[^>]*>', '\n', text)
              text = html.unescape(re.sub(r'<[^>]+>', ' ', text))
              text = re.sub(r'[ \t]+', ' ', text)
              text = re.sub(r'\n\s*\n+', '\n', text).strip()
              print(text[:5000])
          PY
