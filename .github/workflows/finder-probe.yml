name: Finder API probe (diagnostic)

# TEMPORARY DIAGNOSTIC. Dumps the raw shape of SEDIA search results so the
# normaliser in src/gif/finder_data.py can map title / date / budget fields
# correctly. Delete once the mapping is settled.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install requests
        run: pip install requests

      - name: Dump raw SEDIA records
        run: |
          python - <<'PY'
          import json
          import collections
          import requests

          resp = requests.post(
              "https://api.tech.ec.europa.eu/search-api/prod/rest/search",
              params={"apiKey": "SEDIA", "text": '"bioeconomy"',
                      "pageSize": "25", "pageNumber": "1"},
              data={"query": json.dumps({"bool": {"must": [
                        {"terms": {"type": ["1"]}},
                        {"terms": {"status": ["31094501", "31094502", "31094503"]}}]}}),
                    "languages": json.dumps(["en"]),
                    "sort": json.dumps({"field": "sortStatus", "order": "DESC"})},
              timeout=60)
          resp.raise_for_status()
          results = resp.json()["results"]
          print(f"### {len(results)} results\n")

          # Which metadata keys exist, and how often?
          keys = collections.Counter()
          for r in results:
              keys.update((r.get("metadata") or {}).keys())
          print("### metadata key frequency (out of %d)" % len(results))
          for k, n in keys.most_common():
              print(f"  {n:3d}  {k}")

          # Full dump of two records, with long values trimmed.
          def trim(v, n=300):
              s = json.dumps(v, ensure_ascii=False)
              return s if len(s) <= n else s[:n] + f"…(+{len(s) - n} chars)"

          for idx in (0, 1):
              r = results[idx]
              print(f"\n### record {idx} — top-level keys: {sorted(r.keys())}")
              for k, v in sorted((r.get('metadata') or {}).items()):
                  print(f"  {k}: {trim(v)}")

          # Any key that looks budget-ish or date-ish, across all records
          print("\n### budget/date-ish values across all records")
          for r in results[:8]:
              md = r.get("metadata") or {}
              picked = {k: md[k] for k in md
                        if any(w in k.lower() for w in ("budget", "date", "deadline", "title"))}
              print("  -", trim(picked, 500))
          PY
