name: Finder API probe (diagnostic)

# TEMPORARY DIAGNOSTIC for P1. First probe showed cdm:work_is_about is empty
# and the English expression carries no abstract. This one lists the actual
# predicate names (compact) and tests the EuroVoc property directly.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Probe CELLAR predicates
        run: |
          python - <<'PY'
          import requests

          CELLAR = "https://publications.europa.eu/webapi/rdf/sparql"
          CELEX = '"32021R1119"^^<http://www.w3.org/2001/XMLSchema#string>'

          def rows(label, query):
              try:
                  r = requests.get(CELLAR,
                                   params={"query": query,
                                           "format": "application/sparql-results+json"},
                                   headers={"Accept": "application/sparql-results+json"},
                                   timeout=180)
              except Exception as exc:
                  print(f"\n=== {label}: EXCEPTION {exc!r}")
                  return []
              if r.status_code != 200:
                  print(f"\n=== {label}: HTTP {r.status_code} {r.text[:200]}")
                  return []
              out = r.json()["results"]["bindings"]
              print(f"\n=== {label}: {len(out)} rows")
              return out

          # 1. Every predicate on the work, printed compactly (name only).
          res = rows("A work predicates", f"""
          PREFIX cdm: <http://publications.europa.eu/ontology/cdm#>
          SELECT DISTINCT ?p WHERE {{
            ?work cdm:resource_legal_id_celex {CELEX} .
            ?work ?p ?o .
          }} LIMIT 200""")
          names = sorted(b["p"]["value"].rsplit("#", 1)[-1].rsplit("/", 1)[-1] for b in res)
          for n in names:
              print("   ", n)
          print("\n   >>> subject-ish:",
                [n for n in names if any(w in n.lower()
                                         for w in ("about", "concept", "subject", "eurovoc",
                                                   "classif", "descriptor", "theme"))])

          # 2. The EuroVoc property CELLAR actually uses, with English labels.
          for prop in ("work_is_about_concept_eurovoc",
                       "work_is_about_concept_directory-code",
                       "work_is_about_concept"):
              res = rows(f"B cdm:{prop}", f"""
              PREFIX cdm: <http://publications.europa.eu/ontology/cdm#>
              PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
              SELECT ?concept ?label WHERE {{
                ?work cdm:resource_legal_id_celex {CELEX} .
                ?work cdm:{prop} ?concept .
                OPTIONAL {{ ?concept skos:prefLabel ?label . FILTER(LANG(?label) = "en") }}
              }} LIMIT 25""")
              for b in res[:25]:
                  print("    -", b.get("label", {}).get("value")
                        or b["concept"]["value"].rsplit("/", 1)[-1])

          # 3. Reverse direction: find works by a EuroVoc concept label.
          res = rows("C works about EuroVoc 'biomass'", """
          PREFIX cdm: <http://publications.europa.eu/ontology/cdm#>
          PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
          PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
          SELECT ?celex ?title WHERE {
            ?concept skos:prefLabel ?l .
            FILTER(LANG(?l) = "en" && LCASE(STR(?l)) = "biomass")
            ?work cdm:work_is_about_concept_eurovoc ?concept .
            ?work cdm:resource_legal_id_celex ?celex .
            ?work cdm:work_date_document ?date .
            FILTER(?date >= "2015-01-01"^^xsd:date)
            ?exp cdm:expression_belongs_to_work ?work .
            ?exp cdm:expression_uses_language <http://publications.europa.eu/resource/authority/language/ENG> .
            ?exp cdm:expression_title ?title .
          } LIMIT 8""")
          for b in res:
              print(f"    - {b['celex']['value']}: {b['title']['value'][:70]}")
          PY
