name: Freeze a corpus

# On demand only. Fetches every source into a corpus directory with a checksum
# manifest and uploads it as an artifact — nothing is committed, because a
# frozen corpus is study material and because committing one per run would add
# megabytes to the repository each time.
#
# It runs here rather than on a developer machine because some sandboxes cannot
# reach EU hosts, and because a runner is a clean environment: the manifest
# records the tool commit it used, so what produced the corpus is unambiguous.
#
# The artifact is the deliverable. Download it and keep it: re-running this
# workflow does not reproduce the same corpus, which is the reason the manifest
# exists.

on:
  workflow_dispatch:
    inputs:
      since:
        description: "Earliest document date (YYYY-MM-DD)"
        required: false
        default: "1990-01-01"
      until:
        description: "Latest document date (YYYY-MM-DD). Enforced."
        required: true
      programmes:
        description: "CORDIS programmes"
        required: false
        default: "fp6,fp7"
      label:
        description: "Name recorded in the manifest, e.g. A1"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --quiet -e .

      - name: Freeze
        run: |
          gif freeze \
            --out "corpus" \
            --since "${{ inputs.since }}" \
            --until "${{ inputs.until }}" \
            --programmes "${{ inputs.programmes }}" \
            --label "${{ inputs.label }}"

      - name: Verify the manifest describes what is on disk
        run: gif freeze --out corpus --verify

      - name: Manifest
        run: cat corpus/manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: corpus-${{ inputs.label || inputs.until }}
          path: corpus/
