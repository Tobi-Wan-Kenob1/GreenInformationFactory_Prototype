name: Freeze both benchmark corpora (temporary)

# Temporary companion to freeze-corpus.yml. That one is the keeper and takes
# its window as a dispatch input, but workflow_dispatch only resolves against
# the default branch, and this work is on a feature branch. Rather than push a
# workflow to main to make a button appear, this fires on its own push and
# freezes the two windows the benchmark needs.
#
# Delete once freeze-corpus.yml reaches the default branch.

on:
  push:
    branches:
      - claude/policy-grant-finder-l84zm2
    paths:
      - ".github/workflows/freeze-now.yml"

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Two freeze points, so the back-test has an internal replication.
          # FP6 and early FP7 awards were public by end-2009; H2020 did not
          # exist, so the call-topic file is expected to come back empty.
          - label: A1
            until: "2009-12-31"
            programmes: "fp6,fp7"
          - label: A2
            until: "2013-12-31"
            programmes: "fp6,fp7"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --quiet -e .

      - name: Freeze ${{ matrix.label }}
        run: |
          gif freeze --out corpus \
            --since 1990-01-01 \
            --until "${{ matrix.until }}" \
            --programmes "${{ matrix.programmes }}" \
            --label "${{ matrix.label }}"

      - name: Verify
        run: gif freeze --out corpus --verify

      - name: Manifest ${{ matrix.label }}
        run: cat corpus/manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: corpus-${{ matrix.label }}
          path: corpus/
