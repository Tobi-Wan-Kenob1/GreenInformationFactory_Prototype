name: CI

# Python suite for the gif package + helpers, and the browser suite for the
# Policy & Grant Finder, on every push / PR.
on:
  push:
    branches: ["**"]
    # Don't run CI for the Zenodo release/download tags — those drive the
    # upload/download workflows, not the test suite.
    tags-ignore:
      - "zenodo-*"
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 resolves to pandas 2.x, 3.11+ to pandas 3.x — keep all three so
        # incompatibilities between the two major pandas lines stay visible.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        run: pytest -q

      - name: Smoke-test the CLI
        run: |
          gif models
          gif validate

  # The finder is ~1,300 lines of browser JS with no Python behind it: ranking,
  # localStorage scenarios and the SVG charts only exist once a page has run,
  # so they are tested in a real headless Chromium. The suite serves docs/ with
  # frozen fixtures in place of docs/finder/data/{policies,grants}.json, which
  # the finder-data workflow refreshes weekly — otherwise CI would fail every
  # time the EU corpus moved.
  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json

      - name: Install dependencies
        working-directory: tests/browser
        # Skip the postinstall download, which fetches all three browser
        # engines; the next step installs just the one the suite drives.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      - name: Install Chromium
        working-directory: tests/browser
        run: npx playwright install --with-deps chromium

      - name: Run browser suite
        run: node tests/browser/run.js
